<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Codexael Toolstack — Base64 Text Converter</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Metadata -->
        <meta name="description" content="Encode text to Base64 or decode it back, instantly and privately.">
        <meta name="author" content="Codexael">
        <meta name="theme-color" content="#fff4e0" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">

        <!-- Open Graph -->
        <meta property="og:title" content="Codexael Toolstack — Base64 Text Encoder & Decoder">
        <meta property="og:description" content="Encode text to Base64 or decode it back, instantly and privately.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://tools.codexael.com/base64_text_converter.html">
        <meta property="og:image" content="https://tools.codexael.com/assets/images/og-cover.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:alt" content="Codexael Toolstack — Base64 Text Encoder & Decoder">
        <meta property="og:site_name" content="Codexael Toolstack">

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Codexael Toolstack — Base64 Text Encoder & Decoder">
        <meta name="twitter:description" content="Encode text to Base64 or decode it back, instantly and privately.">
        <meta name="twitter:image" content="https://tools.codexael.com/assets/images/og-cover.png">

        <!-- Favicon / App Icon -->
        <link rel="icon" type="image/svg+xml" href="assets/images/codexael_icon.svg">
        <link rel="apple-touch-icon" href="assets/images/codexael_icon.svg">

        <!-- Bootstrap 5.2.0-beta1 -->
        <link rel="stylesheet" href="css/bootstrap.min.css">

        <!-- Bootstrap with Popper 5.2.0-beta1 -->
        <script src="js/bootstrap.bundle.min.js"></script>

        <!-- Bootstrap Icons 1.11.3 -->
        <link rel="stylesheet" href="css/bootstrap-icons.min.css">

        <!-- CodeMirror 5.65.21 -->
        <link rel="stylesheet" href="css/codemirror/codemirror.css">

        <!-- Google fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/find-replace.css">
        <link rel="stylesheet" href="css/keycaps.css">
    </head>
    <body>
        <!-- Common layout -->
        <div id="navbar-container"></div>

        <div class="container-fluid tool-wrapper">
            <div class="row g-3 g-md-0 gx-md-3 gx-0">

                <!-- Left Editor -->
                <div id="inputEditor" class="col-md-5 editor-panel">
                    <div class="editor-header">
                        <span class="editor-title">Input</span>
                        <div class="editor-actions">
                            <button title="Download" onclick="downloadData('base64_text_converter.txt')"><i class="bi bi-download icon-btn"></i></button>
                            <button title="Print" onclick="printData({ title: pageTitle })"><i class="bi bi-printer icon-btn"></i></button>
                            <div class="divider"></div>
                            <button class="btn-danger" title="Clear" data-undo-clear onclick="clearInputs()"><i class="bi bi-x-lg icon-btn"></i></button>
                            <button title="Copy" onclick="copyToClipboard(codeMirrorInput, 'copyInputEditor')"><i class="bi bi-copy icon-btn" id="copyInputEditor"></i></button>
                            <button title="Fullscreen" onclick="toggleEditorFullScreen('inputEditor')"><i class="bi bi-arrows-fullscreen icon-btn"></i></button>
                        </div>
                    </div>

                    <textarea class="editor-body" id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

                    <div class="editor-footer">
                        <div class="status">
                            <span>Ln <b id="inputCurrentLine">1</b></span>
                            <span>Col <b id="inputCurrentColumn">1</b></span>
                            <span>Lines <b id="inputTotalLines">1</b></span>
                        </div>
                    </div>

                </div>

                <!-- Center Actions -->
                <div class="col-md-2 center-col action-panel text-center invisible-scrollbars">
                    <div class="center-actions-wrapper">
                        <button class="btn action-btn-ghost" onclick="openFilePicker()"><i class="bi bi-upload"></i> Upload Data</button>
                        <input type="file" id="fileInput" accept="*" hidden onchange="handleFileSelect(event)">
                    </div>
                    <div class="center-actions-wrapper overflow-hidden">
                        <div class="center-actions-label">Encoding</div>
                        <div class="segmented-control btn-group full-width" role="group" aria-label="Radio toggle">
                            <input type="radio" name="encoding" id="utf8" value="utf8">
                            <label for="utf8">UTF-8</label>

                            <input type="radio" name="encoding" id="ascii" value="ascii">
                            <label for="ascii">ASCII</label>
                        </div>
                    </div>
                    <div class="center-actions-wrapper">
                        <button class="btn action-btn-primary" data-shortcut="run" onclick="base64Encoding()"><i class="bi bi-magic"></i> Encode</button>
                        <button class="btn action-btn-primary" onclick="base64Decoding()"><i class="bi bi-magic"></i> Decode</button>
                    </div>
                </div>

                <!-- Right Editor -->
                <div id="outputEditor" class="col-md-5 editor-panel">
                    <div class="editor-header">
                        <span class="editor-title">Output</span>
                        <div class="editor-actions">
                            <button title="Download" onclick="downloadData('base64_text_converter.txt', false)"><i class="bi bi-download icon-btn"></i></button>
                            <button title="Print" onclick="printData({ title: pageTitle, isInput: false })"><i class="bi bi-printer icon-btn"></i></button>
                            <div class="divider"></div>
                            <button class="btn-danger" title="Clear" data-undo-clear="Output cleared" onclick="clearInput(codeMirrorOutput)"><i class="bi bi-x-lg icon-btn"></i></button>
                            <button title="Copy" data-shortcut="copy" onclick="copyToClipboard(codeMirrorOutput, 'copyOutputEditor')"><i class="bi bi-copy icon-btn" id="copyOutputEditor"></i></button>
                            <button title="Fullscreen" onclick="toggleEditorFullScreen('outputEditor')"><i class="bi bi-arrows-fullscreen icon-btn"></i></button>
                        </div>
                    </div>

                    <textarea class="editor-body" id="output" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

                    <div class="editor-footer">
                        <div class="status">
                            <span>Ln <b id="outputCurrentLine">1</b></span>
                            <span>Col <b id="outputCurrentColumn">1</b></span>
                            <span>Lines <b id="outputTotalLines">1</b></span>
                        </div>
                    </div>

                </div>
            </div>
        </div>


        <!-- CodeMirror 5.65.21 -->
        <script src="js/codemirror/codemirror.js"></script>
        <script src="js/codemirror/active-line.js"></script>

        <div id="footer-container"></div>

        <!-- Common JS -->
        <script src="js/tool-help.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/common.js"></script>
        <script src="js/script.js"></script>
        <script src="js/find-replace.js"></script>

        <!-- Custom JS -->
        <script>

            // Elements
            const pageTitle = "Base64 Text Converter";
            const STORAGE_ENCODING_KEY = "encoding";

            const input = document.getElementById("input");
            const output = document.getElementById("output");
            const fileInput = document.getElementById("fileInput");

            const inputTotalLines = document.getElementById('inputTotalLines');
            const inputCurrentLine = document.getElementById('inputCurrentLine');
            const inputCurrentColumn = document.getElementById('inputCurrentColumn');

            const outputTotalLines = document.getElementById('outputTotalLines');
            const outputCurrentLine = document.getElementById('outputCurrentLine');
            const outputCurrentColumn = document.getElementById('outputCurrentColumn');

            const codeMirrorInput = createCodeMirrorEditor(input);
            const codeMirrorOutput = createCodeMirrorEditor(output);

            // Encodes input data to Base64 format
            function base64Encoding() {
                try {
                    clearInput(codeMirrorOutput);
                    if (!codeMirrorInput.getValue().trim()) {
                        showInfoToast("Nothing to print");
                        return;
                    }


                    const selected = document.querySelector('input[name="encoding"]:checked');
                    if (selected && selected.value === "ascii") {
                        codeMirrorOutput.setValue(btoa(codeMirrorInput.getValue().replace(/[^\x00-\x7F]/g, '?')));
                    }
                    else {
                        codeMirrorOutput.setValue(btoa(unescape(encodeURIComponent(codeMirrorInput.getValue()))));
                    }
                } catch (error) {
                    console.log("Encoding error:", error.message);
                    showErrorToast("Error encoding");
                }
            }

            // Decodes Base64 string back to original data
            function base64Decoding() {
                try {
                    clearInput(codeMirrorOutput);
                    if (!codeMirrorInput.getValue().trim()) {
                        showInfoToast("Nothing to print");
                        return;
                    }

                    const selected = document.querySelector('input[name="encoding"]:checked');
                    if (selected && selected.value === "ascii") {
                        codeMirrorOutput.setValue(atob(codeMirrorInput.getValue()));
                    }
                    else {
                        codeMirrorOutput.setValue(decodeURIComponent(escape(atob(codeMirrorInput.getValue()))));
                    }
                } catch (error) {
                    console.log("Decoding error:", error.message);
                    showErrorToast("Error decoding");
                }
            }

            setupEditors([
                createEditorConfig(codeMirrorInput, inputTotalLines, inputCurrentLine, inputCurrentColumn),
                createEditorConfig(codeMirrorOutput, outputTotalLines, outputCurrentLine, outputCurrentColumn)
            ]);

            // Runs after HTML content has fully loaded, get encoding type from local storage
            window.addEventListener("DOMContentLoaded", () => {
                const encoding = document.querySelectorAll("input[name='encoding']");
                const saved_encoding = getStorageString(STORAGE_ENCODING_KEY);

                let anyChecked = false;

                encoding.forEach(type => {
                    if (type.value === saved_encoding) {
                        type.checked = true;
                        anyChecked = true;
                    }
                });

                if (!anyChecked) {
                    encoding[0].checked = true;
                    setStorageString(STORAGE_ENCODING_KEY, encoding[0].value);
                }

                encoding.forEach(radio => {
                    radio.addEventListener("change", () => {
                        setStorageString(STORAGE_ENCODING_KEY, radio.value);
                        clearInput(codeMirrorOutput);
                    });
                });
            });
        </script>
        
    </body>
</html>
