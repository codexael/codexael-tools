<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Codexael Toolstack — Wikipedia Today</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Content-Security-Policy" content="connect-src https://api.wikimedia.org; img-src 'self' data: https://upload.wikimedia.org https://thumb.wikimedia.org; object-src 'none'; base-uri 'none'; form-action 'none'">

        <!-- Metadata -->
        <meta name="description" content="Today's featured article, picture of the day, news and most-read articles, all in one place.">
        <meta name="author" content="Codexael">
        <meta name="theme-color" content="#fff4e0" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">

        <!-- Open Graph -->
        <meta property="og:title" content="Codexael Toolstack — Wikipedia Today">
        <meta property="og:description" content="Today's featured article, picture of the day, news and most-read articles, all in one place.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://tools.codexael.com/wikipedia_today.html">
        <meta property="og:image" content="https://tools.codexael.com/assets/images/og-cover.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:alt" content="Codexael Toolstack — Wikipedia Today">
        <meta property="og:site_name" content="Codexael Toolstack">

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Codexael Toolstack — Wikipedia Today">
        <meta name="twitter:description" content="Today's featured article, picture of the day, news and most-read articles, all in one place.">
        <meta name="twitter:image" content="https://tools.codexael.com/assets/images/og-cover.png">

        <!-- Favicon / App Icon -->
        <link rel="icon" type="image/svg+xml" href="assets/images/codexael_icon.svg">
        <link rel="apple-touch-icon" href="assets/images/codexael_icon.svg">

        <!-- Bootstrap 5.2.0-beta1 -->
        <link rel="stylesheet" href="css/bootstrap.min.css">

        <!-- Bootstrap with Popper 5.2.0-beta1 -->
        <script src="js/bootstrap.bundle.min.js"></script>

        <!-- Bootstrap Icons 1.11.3 -->
        <link rel="stylesheet" href="css/bootstrap-icons.min.css">

        <!-- Google fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/keycaps.css">

        <style>
            .wiki-body {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 22px;
                padding: 24px 22px 28px;
            }

            .wiki-body.loading .wiki-content { opacity: 0.55; }

            /* The date bar lets users step one day back or forward. */
            .date-bar {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .date-bar .date-label {
                flex: 1;
                min-width: 0;
                font-family: var(--display-font);
                font-size: 1.05rem;
                text-align: center;
            }

            .date-bar button {
                flex: none;
                width: 42px;
                height: 42px;
                display: grid;
                place-items: center;
                padding: 0;
                background: var(--paper);
                color: var(--ink);
                border: 3px solid var(--ink);
                border-radius: 10px;
                box-shadow: 0 2px 0 var(--ink);
            }

            .date-bar button:not(:disabled):hover { background: var(--yellow); color: #111111; }
            .date-bar button:disabled { opacity: 0.4; }

            .wiki-content {
                display: flex;
                flex-direction: column;
                gap: 22px;
            }

            .wiki-section {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .section-label {
                align-self: flex-start;
                padding: 2px 10px;
                background: var(--ink);
                color: var(--bg);
                font-family: var(--display-font);
                font-size: 0.75rem;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            /* The featured article and picture sit on coloured cards that keep dark text in both themes. */
            .feature-card {
                display: flex;
                gap: 18px;
                padding: 18px 20px;
                color: #111111;
                border: 3px solid var(--ink);
                border-radius: 12px;
                box-shadow: 4px 4px 0 var(--ink);
                overflow-wrap: anywhere;
            }

            .feature-card.article { background: var(--orange); }
            .feature-card.picture { background: var(--cyan); flex-direction: column; }

            .feature-card img {
                flex: none;
                max-width: 160px;
                max-height: 200px;
                width: auto;
                height: auto;
                align-self: flex-start;
                border: 2px solid #111111;
                background: #ffffff;
            }

            .feature-card.picture img {
                max-width: 100%;
                max-height: 420px;
                align-self: center;
            }

            .feature-text {
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .feature-title {
                margin: 0;
                font-family: var(--display-font);
                font-size: 1.2rem;
                line-height: 1.3;
            }

            .feature-text p { margin: 0; line-height: 1.55; }
            .feature-text small { font-weight: 700; }

            .feature-card a {
                align-self: flex-start;
                color: #111111;
                font-weight: 700;
            }

            .wiki-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            .wiki-list li {
                display: flex;
                gap: 12px;
                padding: 10px 12px;
                background: var(--paper);
                border: 2px solid var(--ink);
                border-radius: 8px;
                font-size: 0.88rem;
                line-height: 1.5;
                overflow-wrap: anywhere;
            }

            .wiki-list .lead {
                flex: none;
                min-width: 44px;
                font-family: var(--display-font);
                font-variant-numeric: tabular-nums;
            }

            .wiki-list .item-text { flex: 1; min-width: 0; }

            .wiki-list a {
                color: var(--ink);
                font-weight: 700;
            }

            .wiki-list .views {
                display: block;
                font-size: 0.75rem;
                font-variant-numeric: tabular-nums;
            }

            .wiki-status {
                margin: 0;
                font-size: 0.85rem;
                font-weight: 700;
            }

            .privacy-note {
                padding: 10px 12px;
                border: 2px dashed var(--ink);
                font-size: 0.75rem;
                font-weight: 700;
                line-height: 1.5;
            }

            @media (max-width: 576px) {
                .wiki-body {
                    padding: 20px 16px 24px;
                }

                .feature-card.article {
                    flex-direction: column;
                }

                .feature-card img {
                    max-width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <!-- Common layout -->
        <div id="navbar-container"></div>

        <div class="container-fluid tool-wrapper">
            <div class="row">
                <div class="col-md-8 offset-md-2">
                    <div class="editor-panel">
                        <div class="editor-header">
                            <span class="editor-title">Wikipedia Today</span>
                            <div class="editor-actions">
                                <button title="Reload" id="headerReloadBtn" onclick="loadFeed()"><i class="bi bi-arrow-clockwise icon-btn"></i></button>
                                <div class="divider"></div>
                                <button title="Share this page" onclick="shareFeed()"><i class="bi bi-share icon-btn"></i></button>
                            </div>
                        </div>

                        <div class="editor-body wiki-body loading" id="wikiBody">

                            <div class="date-bar">
                                <button id="prevDayBtn" title="Previous day" aria-label="Previous day" onclick="changeDay(-1)"><i class="bi bi-chevron-left"></i></button>
                                <span class="date-label" id="dateLabel" aria-live="polite"></span>
                                <button id="nextDayBtn" title="Next day" aria-label="Next day" onclick="changeDay(1)"><i class="bi bi-chevron-right"></i></button>
                                <button id="todayBtn" title="Back to today" aria-label="Back to today" onclick="goToToday()"><i class="bi bi-calendar-day"></i></button>
                            </div>

                            <p class="wiki-status" id="wikiStatus" role="status">Loading Wikipedia's picks for the day...</p>

                            <div class="wiki-content" id="wikiContent"></div>

                            <div class="privacy-note">
                                <i class="bi bi-info-circle"></i> Content comes from Wikipedia's free <a href="https://api.wikimedia.org/wiki/Feed_API" target="_blank" rel="noopener noreferrer">Feed API</a> and is shared under Wikipedia's Creative Commons licences. Images belong to the people credited with them. No data about you is sent with the request.
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div id="footer-container"></div>

        <!-- Common JS -->
        <script src="js/tool-help.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/common.js"></script>
        <script src="js/script.js"></script>
        <script src="js/api-client.js"></script>

        <!-- Custom JS -->
        <script>

            const pageTitle = "Wikipedia Today";

            const FEED_URL = "https://api.wikimedia.org/feed/v1/wikipedia/en/featured/";
            const FEED_MAX_BYTES = 3 * 1024 * 1024;
            const MOST_READ_LIMIT = 10;
            const ON_THIS_DAY_LIMIT = 8;

            // The feed starts in 2015, so earlier dates are not offered.
            const FIRST_FEED_DATE = new Date(2015, 0, 1);

            const wikiBody = document.getElementById("wikiBody");
            const wikiContent = document.getElementById("wikiContent");
            const wikiStatus = document.getElementById("wikiStatus");
            const dateLabel = document.getElementById("dateLabel");
            const prevDayBtn = document.getElementById("prevDayBtn");
            const nextDayBtn = document.getElementById("nextDayBtn");
            const todayBtn = document.getElementById("todayBtn");
            const headerReloadBtn = document.getElementById("headerReloadBtn");

            let viewDate = startOfDay(new Date());
            let hasContent = false;
            let feedController = null;
            let retryWhenOnline = false;

            function startOfDay(date) {
                return new Date(date.getFullYear(), date.getMonth(), date.getDate());
            }

            function isToday(date) {
                return date.getTime() === startOfDay(new Date()).getTime();
            }

            function feedPath(date) {
                return `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}`;
            }

            // Updates the date label and turns off the arrows at the first and last dates.
            function renderDateBar() {
                dateLabel.textContent = viewDate.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "long", year: "numeric" });
                nextDayBtn.disabled = isToday(viewDate);
                todayBtn.disabled = isToday(viewDate);
                prevDayBtn.disabled = viewDate <= FIRST_FEED_DATE;
            }

            // Turns HTML from the feed into plain text without running or showing any markup.
            function htmlToText(html) {
                if (typeof html !== "string") return "";
                return new DOMParser().parseFromString(html, "text/html").body.textContent.replace(/\s+/g, " ").trim();
            }

            function text(value) {
                return typeof value === "string" ? value.trim() : "";
            }

            // Returns the link only when it points to Wikipedia or Wikimedia over https.
            function wikiUrl(value) {
                try {
                    const url = new URL(value);
                    return url.protocol === "https:" && /(^|\.)(wikipedia|wikimedia)\.org$/.test(url.hostname) ? url.href : null;
                } catch {
                    return null;
                }
            }

            // Returns an image address only when it is served from Wikimedia's image hosts.
            function imageUrl(value) {
                try {
                    const url = new URL(value);
                    return url.protocol === "https:" && ["upload.wikimedia.org", "thumb.wikimedia.org"].includes(url.hostname) ? url.href : null;
                } catch {
                    return null;
                }
            }

            function pageLink(page) {
                return wikiUrl(page?.content_urls?.desktop?.page);
            }

            function pageTitleOf(page) {
                return text(page?.titles?.normalized) || text(page?.title).replace(/_/g, " ");
            }

            function createLink(href, label) {
                const link = document.createElement("a");
                link.href = href;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = label;
                return link;
            }

            function createImage(source, alt) {
                const src = imageUrl(source?.source);
                if (!src) return null;
                const img = document.createElement("img");
                img.src = src;
                img.alt = alt;
                img.loading = "lazy";
                img.referrerPolicy = "no-referrer";
                if (Number.isFinite(source.width) && Number.isFinite(source.height)) {
                    img.width = source.width;
                    img.height = source.height;
                }
                return img;
            }

            function createSection(label, ...children) {
                const section = document.createElement("section");
                section.className = "wiki-section";
                const heading = document.createElement("h2");
                heading.className = "section-label";
                heading.textContent = label;
                section.append(heading, ...children.filter(Boolean));
                return section;
            }

            // Builds a list where each row has a short lead such as a year or rank and a body.
            function createList(rows) {
                const list = document.createElement("ul");
                list.className = "wiki-list";
                list.append(...rows.map(({ lead, body }) => {
                    const row = document.createElement("li");
                    if (lead) {
                        const leadEl = document.createElement("span");
                        leadEl.className = "lead";
                        leadEl.textContent = lead;
                        row.append(leadEl);
                    }
                    const bodyEl = document.createElement("div");
                    bodyEl.className = "item-text";
                    bodyEl.append(...body.filter(Boolean));
                    row.append(bodyEl);
                    return row;
                }));
                return list;
            }

            function featuredArticleSection(tfa) {
                const title = pageTitleOf(tfa);
                if (!title) return null;
                const card = document.createElement("div");
                card.className = "feature-card article";
                const img = createImage(tfa.thumbnail, title);
                if (img) card.append(img);

                const body = document.createElement("div");
                body.className = "feature-text";
                const heading = document.createElement("h3");
                heading.className = "feature-title";
                heading.textContent = title;
                body.append(heading);
                if (text(tfa.description)) {
                    const description = document.createElement("small");
                    description.textContent = text(tfa.description);
                    body.append(description);
                }
                const extract = document.createElement("p");
                extract.textContent = text(tfa.extract);
                body.append(extract);
                const link = pageLink(tfa);
                if (link) body.append(createLink(link, "Read the full article →"));
                card.append(body);
                return createSection("Featured article", card);
            }

            function pictureSection(image) {
                const img = createImage(image?.thumbnail, htmlToText(image?.description?.html) || "Picture of the day");
                if (!img) return null;
                const card = document.createElement("div");
                card.className = "feature-card picture";
                card.append(img);

                const body = document.createElement("div");
                body.className = "feature-text";
                const caption = document.createElement("p");
                caption.textContent = text(image.description?.text) || htmlToText(image.description?.html);
                body.append(caption);
                const artist = text(image.artist?.text) || htmlToText(image.artist?.html);
                if (artist) {
                    const credit = document.createElement("small");
                    credit.textContent = `Photo: ${artist}`;
                    body.append(credit);
                }
                const link = wikiUrl(image.file_page);
                if (link) body.append(createLink(link, "See the full picture and licence →"));
                card.append(body);
                return createSection("Picture of the day", card);
            }

            function newsSection(news) {
                if (!Array.isArray(news) || !news.length) return null;
                return createSection("In the news", createList(news.map(story => {
                    const link = pageLink(story.links?.[0]);
                    return { body: [document.createTextNode(htmlToText(story.story) + " "), link && createLink(link, "Read more")] };
                })));
            }

            function mostReadSection(mostread) {
                const articles = Array.isArray(mostread?.articles) ? mostread.articles.slice(0, MOST_READ_LIMIT) : [];
                if (!articles.length) return null;
                const day = Date.parse(mostread.date);
                const label = Number.isFinite(day) ? `Most read on ${new Date(day).toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" })}` : "Most read";
                return createSection(label, createList(articles.map((article, index) => {
                    const link = pageLink(article);
                    const title = pageTitleOf(article);
                    const views = document.createElement("span");
                    views.className = "views";
                    views.textContent = [Number.isFinite(article.views) ? `${article.views.toLocaleString()} views` : "", text(article.description)].filter(Boolean).join(" · ");
                    return { lead: `#${index + 1}`, body: [link ? createLink(link, title) : document.createTextNode(title), views] };
                })));
            }

            function onThisDaySection(events) {
                if (!Array.isArray(events) || !events.length) return null;
                return createSection("On this day", createList(events.slice(0, ON_THIS_DAY_LIMIT).map(event => {
                    const link = pageLink(event.pages?.[0]);
                    return { lead: String(event.year ?? ""), body: [document.createTextNode(text(event.text) + " "), link && createLink(link, "Read more")] };
                })));
            }

            function didYouKnowSection(items) {
                if (!Array.isArray(items) || !items.length) return null;
                return createSection("Did you know", createList(items.map(item => ({ body: [document.createTextNode(htmlToText(item.html))] }))));
            }

            // Draws every section the feed has for the chosen day, in a fixed order.
            function renderFeed(feed) {
                const sections = [
                    featuredArticleSection(feed.tfa),
                    pictureSection(feed.image),
                    newsSection(feed.news),
                    mostReadSection(feed.mostread),
                    onThisDaySection(feed.onthisday),
                    didYouKnowSection(feed.dyk)
                ].filter(Boolean);
                if (!sections.length) throw new ApiError("Wikipedia has no picks for this day", "invalid");
                wikiContent.replaceChildren(...sections);
                hasContent = true;
            }

            function setLoading(isLoading) {
                wikiBody.classList.toggle("loading", isLoading);
                headerReloadBtn.disabled = isLoading;
            }

            // Loads the feed for the chosen day and keeps the last good day on screen when it fails.
            async function loadFeed() {
                if (feedController) feedController.abort();
                const controller = new AbortController();
                feedController = controller;
                retryWhenOnline = false;
                renderDateBar();
                setLoading(true);
                wikiStatus.textContent = "Loading Wikipedia's picks for the day...";

                try {
                    const feed = await fetchPublicJson(FEED_URL + feedPath(viewDate), { serviceName: "Wikipedia", maxBytes: FEED_MAX_BYTES, signal: controller.signal });
                    if (!feed || typeof feed !== "object") throw new ApiError("Wikipedia sent an unexpected reply", "invalid");
                    renderFeed(feed);
                    wikiStatus.textContent = "";
                    window.scrollTo({ top: 0 });
                } catch (error) {
                    // A request replaced by a newer one ends quietly.
                    if (error.kind === "aborted") return;

                    showErrorToast(error.message);
                    if (error.kind === "offline") {
                        retryWhenOnline = true;
                        wikiStatus.textContent = "You are offline. This day will load when your connection comes back.";
                    } else {
                        wikiStatus.textContent = `${error.message}.${hasContent ? " The day shown below is the last one that loaded." : " Click reload to try again."}`;
                    }
                } finally {
                    if (feedController === controller) {
                        feedController = null;
                        setLoading(false);
                    }
                }
            }

            function changeDay(step) {
                const next = new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + step);
                if (next > startOfDay(new Date()) || next < FIRST_FEED_DATE) return;
                viewDate = next;
                loadFeed();
            }

            function goToToday() {
                viewDate = startOfDay(new Date());
                loadFeed();
            }

            // Shares the featured article of the day shown, or the page itself when there is none.
            function shareFeed() {
                const title = wikiContent.querySelector(".feature-title")?.textContent;
                const shareText = title ? `📚 Today's featured Wikipedia article: ${title}` : "📚 Wikipedia's picks for today";
                if (navigator.share) {
                    navigator.share({ title: "Wikipedia Today", text: shareText, url: location.href }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(`${shareText}\n${location.href}`)
                        .then(() => showSuccessToast("Copied to clipboard"))
                        .catch(() => showErrorToast("Could not copy, your browser blocked the clipboard"));
                }
            }

            loadFeed();

            // The day that failed while offline loads when the connection comes back.
            window.addEventListener("online", () => {
                if (retryWhenOnline && !feedController) loadFeed();
            });
        </script>

    </body>
</html>
