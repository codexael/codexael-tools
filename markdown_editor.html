            // Elements
            const pageTitle = "Markdown Editor";

            // Sample Markdown used to populate the input editor for quick testing
            const DUMMY_MARKDOWN = `An h1 header

            const input = document.getElementById("input");
            const fileInput = document.getElementById("fileInput");
            const headingSelect = document.getElementById("headingSelect");
            CustomDropdown.enhance(headingSelect);
            const previewFrame = document.getElementById("previewFrame");

            const inputTotalLines = document.getElementById('inputTotalLines');
            const inputCurrentLine = document.getElementById('inputCurrentLine');
            const inputCurrentColumn = document.getElementById('inputCurrentColumn');

            const codeMirrorInput = CodeMirror.fromTextArea(input, {
                lineNumbers: true,
                lineWrapping: true,
                mode: "gfm",
                styleActiveLine: true,
                autoCloseBrackets: true,
                matchBrackets: true
            });
            attachFindReplace(codeMirrorInput);

            // Holds the last sanitized render, used by the preview iframe and HTML export/print
            let renderedHtml = "";

            const MARKDOWN_PREVIEW_STYLES = `
                @import url("https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap");
                *, *::before, *::after { box-sizing: border-box; }
                html, body { scrollbar-width: none; -ms-overflow-style: none; }
                html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
                :root {
                    --md-bg: #ffffff;
                    --md-fg: #111111;
                    --md-soft: #fff4e0;
                    --md-on-color: #111111;
                    --md-yellow: #ffd23f;
                    --md-pink: #ff6fb5;
                    --md-cyan: #3bceac;
                    --md-lilac: #b69cff;
                    --md-display: "Archivo Black", sans-serif;
                    --md-mono: "Space Mono", monospace;
                }
                body.theme-dark {
                    --md-bg: #25211a;
                    --md-fg: #f3e9d2;
                    --md-soft: #17140f;
                }
                body { font-family: var(--md-mono); font-size: 15px; background: var(--md-bg); color: var(--md-fg); margin: 0 auto; padding: 24px 28px 60px; line-height: 1.7; overflow-wrap: break-word; }
                h1, h2, h3, h4, h5, h6 { font-family: var(--md-display); font-weight: 400; margin: 1.5em 0 0.6em; line-height: 1.2; letter-spacing: -0.01em; }
                body > :first-child { margin-top: 0; }
                h1 { font-size: 2em; text-transform: uppercase; padding-bottom: 0.25em; border-bottom: 4px solid var(--md-fg); }
                h2 { font-size: 1.5em; padding-bottom: 0.25em; border-bottom: 3px dashed var(--md-fg); }
                h3 { font-size: 1.25em; }
                h4 { font-size: 1.1em; }
                h5 { font-size: 1em; }
                h6 { font-size: 0.9em; text-transform: uppercase; }
                p, ul, ol, table, blockquote, pre { margin: 0.9em 0; }
                strong { font-weight: 700; }
                a { color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--md-pink); text-decoration-thickness: 3px; text-underline-offset: 3px; }
                a:hover { background: var(--md-yellow); color: var(--md-on-color); text-decoration-color: var(--md-on-color); }
                mark { background: var(--md-yellow); color: var(--md-on-color); padding: 0 3px; }
                img { max-width: 100%; height: auto; border: 3px solid var(--md-fg); box-shadow: 2.5px 2.5px 0 var(--md-fg); }
                code { font-family: var(--md-mono); font-size: 0.85em; -webkit-box-decoration-break: clone; box-decoration-break: clone; background: var(--md-soft); color: var(--md-fg); border: 2px solid var(--md-fg); padding: 0 5px; }
                pre { background: var(--md-soft); border: 3px solid var(--md-fg); box-shadow: 2.5px 2.5px 0 var(--md-fg); padding: 14px 16px; margin-right: 5px; overflow-x: auto; line-height: 1.55; }
                pre code { background: none; border: 0; padding: 0; font-size: 0.85em; white-space: pre; }
                blockquote { margin-left: 0; margin-right: 0; padding: 6px 16px; background: var(--md-soft); border: 3px solid var(--md-fg); border-left: 10px solid var(--md-pink); }
                blockquote > :first-child { margin-top: 0; }
                blockquote > :last-child { margin-bottom: 0; }
                table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; border: 3px solid var(--md-fg); }
                th, td { border: 2px solid var(--md-fg); padding: 6px 12px; text-align: left; line-height: 1.45; }
                th { white-space: nowrap; background: var(--md-fg); color: var(--md-bg); font-family: var(--md-display); font-weight: 400; text-transform: uppercase; font-size: 0.85em; }
                tr:nth-child(2n) td { background: var(--md-soft); }
                hr { border: 0; border-top: 3px dashed var(--md-fg); margin: 1.8em 0; }
                ul, ol { padding-left: 1.6em; }
                li { margin: 0.25em 0; }
                li::marker { font-weight: 700; }
                li:has(> input[type="checkbox"]), li:has(> p > input[type="checkbox"]) { list-style: none; }
                input[type="checkbox"] { appearance: none; -webkit-appearance: none; display: inline-grid; place-content: center; width: 18px; height: 18px; margin: 0 8px 0 -1.4em; vertical-align: -3px; background: var(--md-bg); border: 3px solid var(--md-fg); }
                input[type="checkbox"]:checked { background: var(--md-yellow); }
                input[type="checkbox"]:checked::before { content: "\\2713"; color: var(--md-on-color); font: 400 0.8rem/1 var(--md-display); }
                ul.contains-task-list { list-style: none; padding-left: 0.5em; }
                @media (max-width: 480px) { body { padding: 16px 16px 40px; font-size: 14px; } }
                body.is-empty { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
                .md-empty-state { text-align: center; max-width: 380px; padding: 22px 20px; background: var(--md-bg); border: 3px solid var(--md-fg); box-shadow: 3px 3px 0 var(--md-fg); transform: rotate(-1.5deg); }
                .md-empty-icon { display: inline-grid; place-items: center; width: 60px; height: 60px; margin-bottom: 14px; font-size: 1.8rem; background: var(--md-yellow); border: 3px solid var(--md-fg); border-radius: 12px; box-shadow: 0 2.5px 0 var(--md-fg); }
                .md-empty-title { font-family: var(--md-display); font-size: 1.1rem; text-transform: uppercase; color: var(--md-fg); margin-bottom: 8px; }
                .md-empty-desc { font-size: 0.85rem; line-height: 1.55; color: var(--md-fg); }
            `;

            const EMPTY_PREVIEW_HTML = `
                <div class="md-empty-state">
                    <div class="md-empty-icon">📝</div>
                    <div class="md-empty-title">Nothing to preview yet</div>
                    <div class="md-empty-desc">Start typing Markdown in the editor, or upload a .md file, and your live preview will appear here.</div>
                </div>
            `;

            // Reflects the site-wide theme toggle, which the preview iframe can't inherit via CSS
            function isDarkThemeActive() {
                return document.body.classList.contains("dark-theme");
            }

            // Builds a standalone HTML document for the preview iframe / HTML export
            function buildPreviewDocument(bodyHtml) {
                const isEmpty = !bodyHtml || !bodyHtml.trim();
                const bodyClasses = [isEmpty ? "is-empty" : "", isDarkThemeActive() ? "theme-dark" : ""].filter(Boolean).join(" ");

                return `<!DOCTYPE html>
                    <html>
                        <head>
                            <meta charset="UTF-8">
                            <title>${pageTitle} Preview</title>
                            <style>${MARKDOWN_PREVIEW_STYLES}</style>
                        </head>
                        <body class="${bodyClasses}">${isEmpty ? EMPTY_PREVIEW_HTML : bodyHtml}</body>
                    </html>`;
            }

            // Renders markdown source into sanitized HTML and updates the preview
            function renderMarkdown() {
                try {
                    const raw = marked.parse(codeMirrorInput.getValue(), { gfm: true, breaks: false });
                    renderedHtml = DOMPurify.sanitize(raw, { ADD_ATTR: ["target"] });
                } catch (error) {
                    console.log("Markdown render error:", error.message);
                    showErrorToast("Error rendering Markdown");
                    renderedHtml = "";
                }
                previewFrame.classList.toggle("theme-dark", isDarkThemeActive());
                previewFrame.srcdoc = buildPreviewDocument(renderedHtml);
            }

            // Loads sample Markdown into the input editor
            function loadDummyData() {
                codeMirrorInput.setValue(DUMMY_MARKDOWN);
            }

            // Clears the markdown input and resets the preview
            function clearMarkdownInputs() {
                clearInput(codeMirrorInput);
            }

            // Downloads the rendered content as a standalone HTML file
            function downloadRenderedHTML() {
                try {
                    if (isInputBlank(codeMirrorInput)) return;
                    const blob = new Blob([buildPreviewDocument(renderedHtml)], { type: "text/html" });
                    const url = URL.createObjectURL(blob);

                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "markdown_editor.html";
                    document.body.appendChild(a);
                    a.click();

                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.log("Download HTML error:", error);
                    showErrorToast("Error downloading HTML");
                }
            }

            // Prints the rendered markdown preview as it looks
            function printMarkdownPreview() {
                try {
                    if (isInputBlank(codeMirrorInput)) return;
                    const printWindow = window.open("", "_blank");
                    printWindow.document.write(previewFrame.srcdoc);
                    printWindow.document.close();
                    printWindow.focus();
                    printWindow.print();
                    printWindow.close();
                } catch (error) {
                    console.log("Printing preview error:", error.message);
                    showErrorToast("Error printing preview");
                }
            }

            // Wraps the current selection with the given prefix/suffix, or inserts a placeholder
            function wrapSelection(prefix, suffix, placeholder) {
                const selection = codeMirrorInput.getSelection();
                const text = selection || placeholder;
                const from = codeMirrorInput.getCursor("start");
                codeMirrorInput.replaceSelection(prefix + text + suffix);
                if (!selection) {
                    codeMirrorInput.setSelection(
                        { line: from.line, ch: from.ch + prefix.length },
                        { line: from.line, ch: from.ch + prefix.length + placeholder.length }
                    );
                }
                codeMirrorInput.focus();
            }

            function insertBold() { wrapSelection("**", "**", "bold text"); }
            function insertItalic() { wrapSelection("*", "*", "italic text"); }
            function insertStrikethrough() { wrapSelection("~~", "~~", "strikethrough text"); }
            function insertInlineCode() { wrapSelection("`", "`", "code"); }

            // Prefixes the current line, replacing any previously applied prefix of the same kind
            function insertLinePrefix(prefix, stripPattern = null) {
                const cursor = codeMirrorInput.getCursor();
                const line = codeMirrorInput.getLine(cursor.line);
                const stripped = stripPattern ? line.replace(stripPattern, "") : line;
                codeMirrorInput.replaceRange(
                    prefix + stripped,
                    { line: cursor.line, ch: 0 },
                    { line: cursor.line, ch: line.length }
                );
                codeMirrorInput.setCursor({ line: cursor.line, ch: codeMirrorInput.getLine(cursor.line).length });
                codeMirrorInput.focus();
            }

            function insertBlockquote() { insertLinePrefix("> ", /^(>\s*)+/); }
            function insertUnorderedList() { insertLinePrefix("- ", /^(-|\*|\+)\s+(\[[ x]\]\s+)?/); }
            function insertOrderedList() { insertLinePrefix("1. ", /^\d+\.\s+/); }
            function insertTaskList() { insertLinePrefix("- [ ] ", /^(-|\*|\+)\s+(\[[ x]\]\s+)?/); }

            // Sets (or replaces) the heading level of the current line
            function insertHeading(level) {
                if (!level) return;
                insertLinePrefix("#".repeat(Number(level)) + " ", /^#{1,6}\s*/);
                headingSelect.value = "";
                CustomDropdown.refresh(headingSelect);
            }

            function insertLink() {
                const selection = codeMirrorInput.getSelection();
                codeMirrorInput.replaceSelection(`[${selection || "link text"}](https://example.com)`);
                codeMirrorInput.focus();
            }

            function insertImage() {
                const selection = codeMirrorInput.getSelection();
                codeMirrorInput.replaceSelection(`![${selection || "alt text"}](https://example.com/image.png)`);
                codeMirrorInput.focus();
            }

            // Inserts a multi-line snippet on its own line(s), adding a leading blank line if needed
            function insertOwnLines(snippet) {
                const cursor = codeMirrorInput.getCursor();
                const line = codeMirrorInput.getLine(cursor.line);
                const needsLeadingBreak = line.trim().length > 0;
                codeMirrorInput.replaceRange((needsLeadingBreak ? "\n" : "") + snippet.trim() + "\n", cursor);
                codeMirrorInput.focus();
            }

            function insertHorizontalRule() { insertOwnLines("---"); }
            function insertCodeBlock() { insertOwnLines("```\ncode here\n```"); }
            function insertTable() { insertOwnLines("| Column 1 | Column 2 | Column 3 |\n| --- | --- | --- |\n| Row 1 | Data | Data |\n| Row 2 | Data | Data |"); }

            // script.js applies the saved/system theme on DOMContentLoaded, after this runs — re-render then so the preview picks it up on first load
            const applyTheme = window.themeUpdated;
            window.themeUpdated = function (toggleChecked) {
                applyTheme(toggleChecked);
                renderMarkdown();
            };
            window.addEventListener("DOMContentLoaded", renderMarkdown);

            codeMirrorInput.on("change", renderMarkdown);
            renderMarkdown();

            setupEditors([
                createEditorConfig(codeMirrorInput, inputTotalLines, inputCurrentLine, inputCurrentColumn)
            ]);
        </script>

    </body>
</html>
