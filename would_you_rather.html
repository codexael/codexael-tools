            /* The custom line box is tall enough to paste a whole set. */
            .wr-custom-input {

                resize: vertical;
                font-size: 0.8rem;
                font-weight: 400;
            }

            .wr-errors {
                margin: 0;
                padding: 10px 12px 10px 28px;
                background: var(--red);
                color: #111111;
                border: 3px solid var(--ink);
                font-size: 0.78rem;
                font-weight: 700;
            }

            .wr-sides .party-choice {
                min-height: 90px;
                font-size: 1rem;
                text-align: center;
            }

            /* The first side is always pink and the second always cyan, so the split bar matches the cards. */
            .wr-sides .party-choice:nth-child(1),
            .wr-predict .party-choice:nth-child(1) { --c: var(--pink); }

            .wr-sides .party-choice:nth-child(2),
            .wr-predict .party-choice:nth-child(2) { --c: var(--cyan); }

            .wr-predict .party-choice {
                min-height: 0;
                padding: 8px 12px;
                font-size: 0.82rem;
                text-align: center;
            }

            .wr-or {
                margin: -4px 0;
                font-family: var(--display-font);
                font-size: 0.8rem;
                text-align: center;
                text-transform: uppercase;
            }

            /* The split bar shows how the room voted, with the first side growing from the middle. */
            .wr-split {
                display: flex;
                height: 54px;
                background: var(--paper);
                border: 4px solid var(--ink);
                box-shadow: 4px 4px 0 var(--ink);
                overflow: hidden;
            }

            .wr-split-a,
            .wr-split-b {
                display: flex;
                align-items: center;
                min-width: 0;
                padding: 0 10px;
                color: #111111;
                font-family: var(--display-font);
                font-size: 1.1rem;
                white-space: nowrap;
            }

            .wr-split-a {
                width: var(--share);
                background: var(--pink);
                justify-content: flex-start;
            }

            .wr-split-b {
                flex: 1;
                background: var(--cyan);
                justify-content: flex-end;
            }

            .wr-split-a + .wr-split-b {
                border-left: 4px solid var(--ink);
            }

            .wr-split.is-animated .wr-split-a {
                animation: wr-grow 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            @keyframes wr-grow {
                0% { width: 50%; }
                30% { width: 50%; }
            }

            .wr-sides-names {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .wr-side-names {
                padding: 8px 10px;
                background: var(--paper);
                border: 3px solid var(--ink);
                border-top: 8px solid var(--side-c);
                font-size: 0.8rem;
                overflow-wrap: anywhere;
            }

            .wr-side-names b {
                display: block;
                margin-bottom: 4px;
                font-size: 0.85rem;
            }

            .wr-side-names.is-a { --side-c: var(--pink); }
            .wr-side-names.is-b { --side-c: var(--cyan); }

            .wr-notes {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .wr-note {
                padding: 8px 12px;
                background: var(--paper);
                border: 3px solid var(--ink);
                box-shadow: 2px 2px 0 var(--ink);
                font-size: 0.85rem;
                font-weight: 700;
                text-align: center;
            }

            .wr-note.is-good {
                background: var(--lime);
                color: #111111;
            }

            .wr-note.is-rebel {
                background: var(--orange);
                color: #111111;
            }

            .wr-title {
                display: grid;
                gap: 4px;
                padding: 10px 12px;
                background: var(--pink);
                color: #111111;
                border: 3px solid var(--ink);
                box-shadow: 2px 2px 0 var(--ink);
                font-weight: 700;
                text-align: center;
            }

            .wr-title small {
                font-size: 0.7rem;

            .wr-titles {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));

            }

                clearTimeout(game.timer);
                game.totalMs = ms;
                game.deadline = Date.now() + ms;
                game.timer = setTimeout(onEnd, ms);
            }

            function clearPhaseTimer() {
                clearTimeout(game.timer);
                game.deadline = 0;
                game.totalMs = 0;
            }

                return game.settings.time !== "0";

            }

                return `${mode}|${item.text}|${item.a}|${item.b}`;

                const packs = packId === "mixed" ? Object.values(PACKS) : [PACKS[packId]];
                const all = packs.flatMap(pack => pack[mode].map(entry => makeItem(mode, entry)));

                let fresh = all.filter(item => !game.used.has(itemKey(mode, item)));
                if (fresh.length < count) {
                    all.forEach(item => game.used.delete(itemKey(mode, item)));
                    fresh = all;
                }

                const picked = partyShuffle(fresh).slice(0, count);
                picked.forEach(item => game.used.add(itemKey(mode, item)));
                return picked;
            }

            // This reads pasted custom lines for the chosen mode and returns the good ones with a list of errors for the bad lines.
            function parseCustomItems(text, mode) {
                const items = [];
                const errors = [];

                String(text ?? "").split(/\r?\n/).forEach((line, i) => {
                    if (!line.trim()) return;

                    if (mode === "hot") {
                        const statement = partyCleanText(line, MAX_CUSTOM_LENGTH);
                        if (statement.includes("|")) errors.push(`Line ${i + 1}: hot takes use one statement per line, without "|"`);
                        else if (statement.length > MAX_STATEMENT_LENGTH) errors.push(`Line ${i + 1}: the statement is longer than ${MAX_STATEMENT_LENGTH} characters`);
                        else items.push(makeItem("hot", statement));
                        return;
                    }

                    const parts = line.split("|").map(part => partyCleanText(part, MAX_CUSTOM_LENGTH));
                    if (parts.length !== 2) errors.push(`Line ${i + 1}: needs 2 options split by "|", but has ${parts.length}`);
                    else if (parts.some(part => !part)) errors.push(`Line ${i + 1}: one of the options is empty`);
                    else if (parts.some(part => part.length > MAX_OPTION_LENGTH)) errors.push(`Line ${i + 1}: an option is longer than ${MAX_OPTION_LENGTH} characters`);
                    else if (parts[0].toLowerCase() === parts[1].toLowerCase()) errors.push(`Line ${i + 1}: the two options must be different`);
                    else items.push(makeItem("wyr", parts));
                });

                if (!items.length && !errors.length) errors.push("Paste at least one line first");
                if (items.length > MAX_CUSTOM_ITEMS) errors.push(`Use at most ${MAX_CUSTOM_ITEMS} lines`);

                return { items, errors };
            }

            // ---------- Game flow ----------

            // This starts a game from the chosen pack, where customText is only sent by the room creator for a custom pack.
            function startGame(customText) {
                if (party.players.length < MIN_PLAYERS) {
                    party.emit({ type: "notice", text: `Would You Rather needs at least ${MIN_PLAYERS} players` }, [party.myId]);
                    return;
                }

                const mode = game.settings.mode;
                const count = Number(game.settings.count);
                let items;

                if (game.settings.pack === "custom") {
                    if (typeof customText === "string") {
                        const parsed = parseCustomItems(customText.slice(0, MAX_CUSTOM_LENGTH), mode);
                        if (parsed.errors.length) {
                            party.emit({ type: "notice", text: parsed.errors[0] }, [party.myId]);
                            return;
                        }
                        game.customItems = { mode, items: parsed.items };
                    }

                    if (!game.customItems || game.customItems.mode !== mode || !game.customItems.items.length) {
                        party.emit({ type: "notice", text: "Paste your custom lines first" }, [party.myId]);
                        return;
                    }

                    items = game.customItems.items.slice(0, count);
                    game.packLabel = "Custom";
                } else {
                    items = pickFromPacks(mode, game.settings.pack, count);
                    game.packLabel = game.settings.pack === "mixed" ? "Mixed" : PACKS[game.settings.pack].label;
                }

                game.gameNo += 1;
                game.items = items.map(item => ({ ...item }));
                game.index = -1;
                game.playerIds = party.players.map(p => p.id);
                game.scores = new Map(game.playerIds.map(id => [id, 0]));
                game.rebels = new Map();
                nextQuestion();
            }

            function nextQuestion() {
                clearPhaseTimer();
                game.index += 1;

                if (game.index >= game.items.length) {
                    finishGame();
                    return;
                }

                game.phase = "question";
                game.picks = new Map();
                game.guesses = new Map();
                game.result = null;
                game.gains = new Map();
                if (isTimed()) setPhaseTimer(Number(game.settings.time) * 1000, revealQuestion);
                publish();
            }

            function isDone(id) {
                return game.picks.has(id) && game.guesses.has(id);
            }

            function allDone() {
                return game.playerIds.every(isDone);
            }

            function addCount(map, id, amount) {
                map.set(id, (map.get(id) || 0) + amount);
            }

            // This finds the majority side, gives a point to everyone who predicted it, and counts who sided with the minority.
            function revealQuestion() {
                clearPhaseTimer();

                const picks = [...game.picks.values()];
                const counts = { a: picks.filter(side => side === "a").length, b: picks.filter(side => side === "b").length };
                const majority = counts.a > counts.b ? "a" : counts.b > counts.a ? "b" : null;

                game.gains = new Map();
                if (majority) {
                    for (const [id, guess] of game.guesses) {
                        if (guess === majority) {
                            addCount(game.scores, id, 1);
                            addCount(game.gains, id, 1);
                        }
                    }
                    for (const [id, side] of game.picks) {
                        if (side !== majority) addCount(game.rebels, id, 1);
                    }
                }

                game.result = { counts, majority, picks: Object.fromEntries(game.picks), guesses: Object.fromEntries(game.guesses) };
                game.phase = "reveal";

                if (isTimed()) setPhaseTimer(REVEAL_MS, nextQuestion);
                publish();
            }

            function isLastQuestion() {
                return game.index >= game.items.length - 1;
            }

            function finishGame() {
                clearPhaseTimer();
                game.phase = "final";
                game.gains = new Map();
                publish();
            }

            function buildView(id) {
                const item = game.items[game.index];
                const showItem = (game.phase === "question" || game.phase === "reveal") && item;
                const revealed = game.phase === "reveal";

                return {
                    phase: game.phase,
                    settings: { ...game.settings },
                    gameNo: game.gameNo,
                    packLabel: game.packLabel || (PACK_OPTIONS.find(([key]) => key === game.settings.pack) || ["", "-"])[1],
                    index: game.index,
                    total: game.items.length,
                    inGame: inGame(id),
                    playerIds: [...game.playerIds],
                    item: showItem ? { ...item } : null,
                    doneIds: game.phase === "question" ? game.playerIds.filter(isDone) : [],
                    myPick: showItem ? game.picks.get(id) || null : null,
                    myGuess: showItem ? game.guesses.get(id) || null : null,
                    result: revealed ? game.result : null,
                    isLast: isLastQuestion(),
                    scores: Object.fromEntries(game.scores),
                    gains: revealed ? Object.fromEntries(game.gains) : {},
                    rebels: revealed || game.phase === "final" ? Object.fromEntries(game.rebels) : {},
                    remainingMs: game.deadline ? Math.max(0, game.deadline - Date.now()) : 0,
                    totalMs: game.totalMs
                };
            }

            function publish() {
                party.publish(buildView);
            }

            // This applies one move from a player after checking that the move is allowed right now.
            function handleAction(player, action) {
                if (!action || typeof action.type !== "string") return;

                switch (action.type) {
                    case "setting": {
                        if (!player.host || game.phase !== "lobby") return;
                        const allowed = { mode: Object.keys(MODES), pack: PACK_OPTIONS.map(([key]) => key), count: ["5", "10", "15", "20"], time: ["15", "20", "30", "0"] };
                        if (!allowed[action.key] || !allowed[action.key].includes(String(action.value))) return;
                        game.settings[action.key] = String(action.value);
                        publish();
                        return;
                    }

                    case "start":
                        if (!player.host || (game.phase !== "lobby" && game.phase !== "final")) return;
                        startGame(typeof action.custom === "string" ? action.custom : null);
                        return;

                    case "lobby":
                        if (!player.host || game.phase !== "final") return;
                        clearPhaseTimer();
                        game.phase = "lobby";
                        game.playerIds = [];
                        game.items = [];
                        game.index = -1;
                        publish();
                        return;

                    case "pick":
                    case "guess": {
                        if (game.phase !== "question" || !inGame(player.id)) return;
                        const side = String(action.side);
                        if (side !== "a" && side !== "b") return;
                        (action.type === "pick" ? game.picks : game.guesses).set(player.id, side);

                        if (allDone()) revealQuestion();
                        else publish();
                        return;
                    }

                    case "reveal":
                        if (!player.host || game.phase !== "question") return;
                        revealQuestion();
                        return;

                    case "next":
                        if (!player.host || game.phase !== "reveal") return;
                        nextQuestion();
                        return;
                }
            }

            function handleLeave(player) {
                game.scores.delete(player.id);
                game.gains.delete(player.id);
                game.rebels.delete(player.id);

                if (!inGame(player.id)) {
                    publish();
                    return;
                }

                game.playerIds = game.playerIds.filter(id => id !== player.id);
                game.picks.delete(player.id);
                game.guesses.delete(player.id);

                // This ends the game with the scores so far when too few players are left.
                if (game.playerIds.length < MIN_PLAYERS && game.phase !== "final") {
                    party.emit({ type: "notice", text: `${player.name} left, and Would You Rather needs at least ${MIN_PLAYERS} players` });
                    finishGame();
                    return;
                }

                if (game.phase === "question" && allDone()) {
                    revealQuestion();
                    return;
                }

                publish();
            }

            // ---------- Room ----------

            const party = createPartyRoom({
                gameId: "wyr",
                title: "Would You Rather",
                icon: "bi-signpost-split",
                colour: "var(--pink)",
                intro: "Pick a side, then guess which side most of the room will pick. Read the crowd right to score a point.",
                minPlayers: MIN_PLAYERS,
                maxPlayers: MAX_PLAYERS,
                onEnter() {
                    customErrors = [];
                    animatedReveal = "";
                    if (party.isHost) {
                        resetGame();
                        publish();
                    }
                    startTimerLoop();
                },
                onExit() {
                    resetGame();
                    view = null;
                    customErrors = [];
                    animatedReveal = "";
                    clearInterval(timerInterval);
                    gameBody.innerHTML = "";
                },
                onView(next) {
                    if (!next || typeof next.phase !== "string") return;

                    view = next;
                    viewDeadline = partyDeadlineFrom(next.remainingMs);
                    viewTotalMs = next.totalMs;
                    render();
                },
                onEvent(event) {
                    if (event && event.type === "notice") showInfoToast(String(event.text));
                },
                host: {
                    onJoin: () => publish(),
                    onLeave: handleLeave,
                    onAction: handleAction
                }
            });

            // ---------- Rendering ----------

            function nameOf(id) {
                const player = party.getPlayer(id);
                return player ? player.name : "Someone who left";
            }

            function scoreRows() {
                return view.playerIds
                    .map(id => party.getPlayer(id))
                    .filter(Boolean)
                    .map(p => ({ id: p.id, name: p.name, order: p.order, self: p.id === party.myId, points: view.scores[p.id] || 0, gain: view.gains[p.id] || 0 }));
            }

            function renderLobby() {
                const canEdit = party.isHost;
                const enoughPlayers = party.players.length >= MIN_PLAYERS;
                const hot = view.settings.mode === "hot";

                let customBlock = "";
                if (view.settings.pack === "custom") {
                    customBlock = canEdit
                        ? `<div>
                               <label class="party-label" for="customInput">Your ${hot ? "statements" : "questions"}</label>
                               <textarea class="input-cyan wr-custom-input" id="customInput" spellcheck="false" autocomplete="off" placeholder="${hot ? "One statement per line:&#10;Mondays are the best day of the week." : "One question per line:&#10;Option A | Option B&#10;&#10;Live by the sea | Live in the mountains"}">${partyEscapeHtml(customDraft)}</textarea>
                           </div>
                           ${customErrors.length ? `<ul class="wr-errors">${customErrors.slice(0, MAX_SHOWN_ERRORS).map(error => `<li>${partyEscapeHtml(error)}</li>`).join("")}${customErrors.length > MAX_SHOWN_ERRORS ? `<li>And ${customErrors.length - MAX_SHOWN_ERRORS} more</li>` : ""}</ul>` : ""}`
                        : `<div class="party-hint">The room creator is writing custom ${hot ? "statements" : "questions"}.</div>`;
                }

                return `
                    <div class="party-stage" style="--stage-c: var(--pink)">
                        <span class="party-stage-kicker">How to play</span>
                        <p class="party-stage-text">Each round, pick your side and also guess which side most players will pick. You get 1 point when you guess the majority right. A tie means nobody scores.</p>
                    </div>

                    <div class="party-settings">
                        <div>
                            <span class="party-label">Mode</span>
                            ${partySegmentHtml("mode", Object.entries(MODES), view.settings.mode, !canEdit)}
                        </div>
                        <div>
                            <span class="party-label">Pack</span>
                            ${partySegmentHtml("pack", PACK_OPTIONS, view.settings.pack, !canEdit)}
                        </div>
                        ${customBlock}
                        <div>
                            <span class="party-label">Number of questions</span>
                            ${partySegmentHtml("count", [["5", "5"], ["10", "10"], ["15", "15"], ["20", "20"]], view.settings.count, !canEdit)}
                        </div>
                        <div>
                            <span class="party-label">Time to choose</span>
                            ${partySegmentHtml("time", [["15", "15s"], ["20", "20s"], ["30", "30s"], ["0", "Host-paced"]], view.settings.time, !canEdit)}
                        </div>
                    </div>

                    ${canEdit
                        ? `<button type="button" class="btn action-btn-primary" data-act="start"${enoughPlayers ? "" : " disabled"}><i class="bi bi-play-fill"></i> Start game</button>
                           <div class="party-hint text-center">${enoughPlayers ? "Everyone in the room plays this game." : `Waiting for at least ${MIN_PLAYERS} players.`}</div>`
                        : `<div class="party-empty-hint">Waiting for the room creator to start the game</div>`}`;
            }

            function renderStage() {
                const item = view.item;
                const hot = view.settings.mode === "hot";

                return `
                    <div class="party-stage" style="--stage-c: var(--pink)">
                        <span class="party-stage-kicker">${hot ? "Hot take" : "Would you rather"} · ${view.index + 1} of ${view.total}</span>
                        <h2 class="party-stage-title">${hot ? partyEscapeHtml(item.text) : "Would you rather..."}</h2>
                    </div>`;
            }

            function renderQuestion() {
                const item = view.item;
                const canPlay = view.inGame;

                return `
                    ${renderStage()}
                    ${view.totalMs ? partyTimerHtml("phaseTimer") : ""}
                    <div>
                        <span class="party-label">1. Your side</span>
                        <div class="party-choices wr-sides">
                            <button type="button" class="party-choice${view.myPick === "a" ? " is-selected" : ""}" data-act="pick" data-side="a"${canPlay ? "" : " disabled"}>${partyEscapeHtml(item.a)}</button>
                            <button type="button" class="party-choice${view.myPick === "b" ? " is-selected" : ""}" data-act="pick" data-side="b"${canPlay ? "" : " disabled"}>${partyEscapeHtml(item.b)}</button>
                        </div>
                    </div>
                    <div>
                        <span class="party-label">2. What will most players pick?</span>
                        <div class="party-choices wr-predict">
                            <button type="button" class="party-choice${view.myGuess === "a" ? " is-selected" : ""}" data-act="guess" data-side="a"${canPlay ? "" : " disabled"}><i class="bi bi-people-fill"></i> ${partyEscapeHtml(item.a)}</button>
                            <button type="button" class="party-choice${view.myGuess === "b" ? " is-selected" : ""}" data-act="guess" data-side="b"${canPlay ? "" : " disabled"}><i class="bi bi-people-fill"></i> ${partyEscapeHtml(item.b)}</button>
                        </div>
                    </div>
                    <div class="party-hint text-center">${!canPlay
                        ? "<i class=\"bi bi-eye\"></i> You joined during this game, so you watch until the next one."
                        : view.myPick && view.myGuess ? "You are done. You can still change your mind until the reveal." : "Pick your side and your guess."}
                        ${view.doneIds.length} of ${view.playerIds.length} done.</div>
                    ${party.isHost ? `<button type="button" class="btn action-btn-ghost" data-act="reveal"><i class="bi bi-eye-fill"></i> Reveal now</button>` : ""}`;
            }

            function renderSplit(result) {
                const total = result.counts.a + result.counts.b;
                const shareA = total ? Math.round(result.counts.a / total * 100) : 50;
                const key = `${view.gameNo}-${view.index}`;
                const animate = animatedReveal !== key;
                animatedReveal = key;

                return `
                    <div class="wr-split${animate ? " is-animated" : ""}" style="--share: ${shareA}%" role="img" aria-label="${shareA}% picked the first side and ${100 - shareA}% picked the second side">
                        <div class="wr-split-a">${total && shareA > 0 ? `${shareA}%` : ""}</div>
                        <div class="wr-split-b">${total && shareA < 100 ? `${100 - shareA}%` : ""}</div>
                    </div>`;
            }

            function renderMyNotes(result) {
                if (!view.inGame) return "";

                const notes = [];
                const pick = view.myPick;
                const guess = view.myGuess;

                if (!result.majority) {
                    notes.push(`<div class="wr-note">It is a tie, so nobody scores this time.</div>`);
                } else {
                    if (pick === result.majority) notes.push(`<div class="wr-note is-good"><i class="bi bi-people-fill"></i> You sided with the majority.</div>`);
                    else if (pick) notes.push(`<div class="wr-note is-rebel"><i class="bi bi-lightning-fill"></i> You were a rebel this time.</div>`);
                    else notes.push(`<div class="wr-note">You did not pick a side in time.</div>`);

                    if (guess === result.majority) notes.push(`<div class="wr-note is-good"><i class="bi bi-check-circle-fill"></i> +1 point: you read the crowd right.</div>`);
                    else if (guess) notes.push(`<div class="wr-note">Your guess missed the crowd.</div>`);
                    else notes.push(`<div class="wr-note">You did not make a guess in time.</div>`);
                }

                return `<div class="wr-notes">${notes.join("")}</div>`;
            }

            function renderReveal() {
                const item = view.item;
                const result = view.result;
                const sideNames = side => Object.entries(result.picks).filter(([, pick]) => pick === side).map(([id]) => nameOf(id));
                const namesA = sideNames("a");
                const namesB = sideNames("b");

                return `
                    ${renderStage()}
                    ${renderSplit(result)}
                    <div class="wr-sides-names">
                        <div class="wr-side-names is-a">
                            <b>${partyEscapeHtml(item.a)} · ${result.counts.a}${result.majority === "a" ? " · majority" : ""}</b>
                            ${namesA.length ? partyEscapeHtml(namesA.join(", ")) : "Nobody"}
                        </div>
                        <div class="wr-side-names is-b">
                            <b>${partyEscapeHtml(item.b)} · ${result.counts.b}${result.majority === "b" ? " · majority" : ""}</b>
                            ${namesB.length ? partyEscapeHtml(namesB.join(", ")) : "Nobody"}
                        </div>
                    </div>
                    ${renderMyNotes(result)}
                    ${view.totalMs ? partyTimerHtml("phaseTimer") : ""}
                    ${party.isHost
                        ? `<button type="button" class="btn action-btn-primary" data-act="next"><i class="bi bi-skip-forward-fill"></i> ${view.isLast ? "Final scores" : "Next question"}</button>`
                        : `<div class="party-hint text-center">${view.totalMs ? "The next question starts soon." : "Waiting for the room creator to move on."}</div>`}`;
            }

            // This returns the names of the players with the highest count in a map, or null when nobody scored.
            function leaders(counts) {
                const ids = view.playerIds.filter(id => party.getPlayer(id));
                const top = Math.max(0, ...ids.map(id => counts[id] || 0));
                return top > 0 ? { names: ids.filter(id => (counts[id] || 0) === top).map(nameOf), top } : null;
            }

            function renderTitle(icon, title, leader, unit) {
                return `
                    <div class="wr-title">
                        <small><i class="bi ${icon}"></i> ${title}</small>
                        <span>${leader ? `${partyEscapeHtml(leader.names.join(", "))} · ${leader.top} ${unit}` : "Nobody this time"}</span>
                    </div>`;
            }

            function renderFinal() {
                const rows = scoreRows();
                const winner = [...rows].sort((a, b) => b.points - a.points)[0];

                return `
                    <div class="party-stage" style="--stage-c: var(--lime)">
                        <span class="party-stage-kicker">Game over · ${partyEscapeHtml(view.packLabel)}</span>
                        <h2 class="party-stage-title">${winner && winner.points > 0 ? `${partyEscapeHtml(winner.name)} reads the room best!` : "Game over"}</h2>
                    </div>

                    <div class="wr-titles">
                        ${renderTitle("bi-binoculars-fill", "Crowd reader", leaders(view.scores), "right")}
                        ${renderTitle("bi-lightning-fill", "Rebel", leaders(view.rebels), "times in the minority")}
                    </div>

                    <div>
                        <span class="party-label">Final scores · right guesses</span>
                        ${partyScoreboardHtml(rows)}
                    </div>

                    <div class="party-row">
                        <button type="button" class="btn action-btn-ghost" data-act="share"><i class="bi bi-share"></i> Share result</button>
                        ${party.isHost ? `
                            <button type="button" class="btn action-btn-ghost" data-act="lobby"><i class="bi bi-sliders"></i> Change settings</button>
                            <button type="button" class="btn action-btn-primary" data-act="start"${party.players.length >= MIN_PLAYERS ? "" : " disabled"}><i class="bi bi-arrow-repeat"></i> Play again</button>` : ""}
                    </div>
                    ${party.isHost ? "" : `<div class="party-hint text-center">Waiting for the room creator to start the next game.</div>`}`;
            }

            function render() {
                if (!view) return;

                const active = document.activeElement;
                const focused = active && active.id;
                const selection = active && active.tagName === "TEXTAREA" ? [active.selectionStart, active.selectionEnd, active.scrollTop] : null;

                switch (view.phase) {
                    case "lobby": gameBody.innerHTML = renderLobby(); break;
                    case "question": gameBody.innerHTML = renderQuestion(); break;
                    case "reveal": gameBody.innerHTML = renderReveal(); break;
                    case "final": gameBody.innerHTML = renderFinal(); break;
                }

                // This keeps the cursor in the custom line box when a new view arrives.
                const input = focused && document.getElementById(focused);
                if (input && input.tagName === "TEXTAREA" && selection) {
                    input.focus();
                    input.setSelectionRange(selection[0], selection[1]);
                    input.scrollTop = selection[2];
                }

                updateTimer();
                renderBadges();
                renderFooter();
            }

            function renderBadges() {
                const badges = {};

                for (const player of party.players) {
                    const badge = { chip: view.scores[player.id] || 0 };
                    const playing = view.playerIds.includes(player.id);

                    if (view.phase === "question" && playing) {
                        const done = view.doneIds.includes(player.id);
                        badge.icon = done ? "bi-check-circle-fill" : "bi-hourglass-split";
                        badge.iconTitle = done ? "Done" : "Choosing";
                    } else if (view.phase !== "lobby" && !playing) {
                        badge.note = "watching";
                    }

                    badges[player.id] = badge;
                }

                party.setBadges(badges);
            }

            function renderFooter() {
                const inProgress = view.phase === "question" || view.phase === "reveal";
                document.getElementById("footerQuestion").textContent = inProgress ? `${view.index + 1}/${view.total}` : "0";
                document.getElementById("footerPhase").textContent = PHASE_LABELS[view.phase] || "-";
                document.getElementById("footerPack").textContent = view.packLabel;
            }

            function updateTimer() {
                updatePartyTimer(document.getElementById("phaseTimer"), viewDeadline, viewTotalMs);
            }

            function startTimerLoop() {
                clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, TIMER_TICK_MS);
            }

            function serializeResult() {
                if (!view || view.phase !== "final") return "";

                const rows = scoreRows().sort((a, b) => b.points - a.points);
                const me = rows.find(row => row.self);
                if (!me) return rows.length ? `🔀 ${rows[0].name} read the crowd best in Would You Rather with ${rows[0].points}/${view.total} right` : "";

                const rank = 1 + rows.filter(row => row.points > me.points).length;
                return `🔀 I read the crowd right ${me.points}/${view.total} times in Would You Rather and placed #${rank} of ${rows.length}`;
            }

            // ---------- UI events ----------

            // This checks the pasted lines on the room creator's page and starts the game when they are all good.
            function requestStart() {
                if (view.settings.pack !== "custom" || view.phase !== "lobby") {
                    party.act({ type: "start" });
                    return;
                }

                const parsed = parseCustomItems(customDraft, view.settings.mode);
                customErrors = parsed.errors;

                if (customErrors.length) {
                    showErrorToast(customErrors.length === 1 ? customErrors[0] : `${customErrors.length} lines need fixing`);
                    render();
                    return;
                }

                render();
                party.act({ type: "start", custom: customDraft });
            }

            bindPartySegments(gameBody, (key, value) => {
                customErrors = [];
                party.act({ type: "setting", key, value });
            });

            gameBody.addEventListener("click", event => {
                const button = event.target.closest("[data-act]");
                if (!button || button.disabled) return;

                switch (button.dataset.act) {
                    case "start": requestStart(); break;
                    case "lobby": party.act({ type: "lobby" }); break;
                    case "reveal": party.act({ type: "reveal" }); break;
                    case "next": party.act({ type: "next" }); break;
                    case "pick": party.act({ type: "pick", side: button.dataset.side }); break;
                    case "guess": party.act({ type: "guess", side: button.dataset.side }); break;
                    case "share": partyShareText(serializeResult(), button); break;
                }
            });

            gameBody.addEventListener("input", event => {
                if (event.target.id !== "customInput") return;
                customDraft = event.target.value.slice(0, MAX_CUSTOM_LENGTH);

                try {
                    setStorageString(CUSTOM_STORAGE_KEY, customDraft);
                } catch (error) {
                    // This ignores blocked storage because the lines still work for this visit.
                }
            });

            document.getElementById("copyResultBtn").addEventListener("click", event => partyCopyText(serializeResult(), event.currentTarget));
        </script>
    </body>
</html>
