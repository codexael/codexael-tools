<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Codexael Toolstack — QR Generator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Metadata -->
        <meta name="description" content="Turn any link or text into a QR code and download it in one click.">
        <meta name="author" content="Codexael">
        <meta name="theme-color" content="#fff4e0" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">

        <!-- Open Graph -->
        <meta property="og:title" content="Codexael Toolstack — Free QR Code Generator">
        <meta property="og:description" content="Turn any link or text into a QR code and download it in one click.">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://tools.codexael.com/qr_generator.html">
        <meta property="og:image" content="https://tools.codexael.com/assets/images/og-cover.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:alt" content="Codexael Toolstack — Free QR Code Generator">
        <meta property="og:site_name" content="Codexael Toolstack">

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Codexael Toolstack — Free QR Code Generator">
        <meta name="twitter:description" content="Turn any link or text into a QR code and download it in one click.">
        <meta name="twitter:image" content="https://tools.codexael.com/assets/images/og-cover.png">

        <!-- Favicon / App Icon -->
        <link rel="icon" type="image/svg+xml" href="assets/images/codexael_icon.svg">
        <link rel="apple-touch-icon" href="assets/images/codexael_icon.svg">

        <!-- Bootstrap 5.2.0-beta1 -->
        <link rel="stylesheet" href="css/bootstrap.min.css">

        <!-- Bootstrap with Popper 5.2.0-beta1 -->
        <script src="js/bootstrap.bundle.min.js"></script>

        <!-- Bootstrap Icons 1.11.3 -->
        <link rel="stylesheet" href="css/bootstrap-icons.min.css">

        <!-- CodeMirror 5.65.21 -->
        <link rel="stylesheet" href="css/codemirror/codemirror.css">

        <!-- QR Code 1.0.0 -->
        <script src="js/qrcode.min.js"></script>

        <!-- QR Decode 1.4.0 -->
        <script src="js/jsQR.js"></script>

        <!-- Google fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/find-replace.css">
        <link rel="stylesheet" href="css/keycaps.css">

        <style>
            /* Ruler numbers show the size slider minimum and maximum under the track ends. */
            .qr-slider-main-container::before,
            .qr-slider-main-container::after { order: 1; width: 0; margin-top: 2px; display: flex; justify-content: center; font-size: 0.7rem; font-weight: 700; }
            .qr-slider-main-container::before { content: "150"; justify-self: start; }
            .qr-slider-main-container::after { content: "1000"; justify-self: end; }

            /* The QR type keys sit in the middle of the column. */
            .center-actions-wrapper > .segmented-control {
                display: flex;
                justify-content: center;
                width: fit-content;
                margin: 0 auto;
            }

            /* The generated QR code sits on the output area with no frame or shadow. */
            #outputContainer > img,
            #outputContainer > canvas {
                border: 0;
                box-shadow: none;
            }

            /* The output area is plain white in the light theme. */
            #outputEditor,
            #outputEditor .image-body {
                background: #ffffff !important;
            }

            /* The output area is plain black in the dark theme. */
            body.dark-theme #outputEditor,
            body.dark-theme #outputEditor .image-body {
                background: #000000 !important;
            }
        </style>
    </head>
    <body>
        <!-- Common layout -->
        <div id="navbar-container"></div>

        <div class="container-fluid tool-wrapper">
            <div class="row g-3 g-md-0 gx-md-3 gx-0">

                <!-- Left Editor -->
                <div id="inputEditor" class="col-md-5 editor-panel">
                    <div class="editor-header">
                        <span class="editor-title">Input</span>
                        <div class="editor-actions">
                            <button title="Download" onclick="downloadData('qr_generator.txt')"><i class="bi bi-download icon-btn"></i></button>
                            <button title="Print" onclick="printData({ title: pageTitle, value: currentInput })"><i class="bi bi-printer icon-btn"></i></button>
                            <div class="divider"></div>
                            <button class="btn-danger" title="Clear" data-undo-clear onclick="clearQRInputs()"><i class="bi bi-x-lg icon-btn"></i></button>
                            <button title="Copy" onclick="copyToClipboard(codeMirrorInput, 'copyInputEditor')"><i class="bi bi-copy icon-btn" id="copyInputEditor"></i></button>
                            <button title="Fullscreen" onclick="toggleEditorFullScreen('inputEditor')"><i class="bi bi-arrows-fullscreen icon-btn"></i></button>
                        </div>
                    </div>
                    
                    <textarea class="editor-body" id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>

                    <div class="editor-footer">
                        <div class="status">
                            <span>Ln <b id="inputCurrentLine">1</b></span>
                            <span>Col <b id="inputCurrentColumn">1</b></span>
                            <span>Lines <b id="inputTotalLines">1</b></span>
                        </div>
                    </div>

                </div>

                <!-- Center Actions -->
                <div class="col-md-2 center-col action-panel invisible-scrollbars">
                    <div class="center-actions-wrapper overflow-hidden">
                        <div class="center-actions-label">QR Type</div>
                        <div class="segmented-control btn-group full-width" role="group" aria-label="Radio toggle">
                            <input type="radio" name="qr_type" id="encoded" value="encoded">
                            <label for="encoded">Encoded</label>

                            <input type="radio" name="qr_type" id="plain" value="plain">
                            <label for="plain">Plain</label>
                        </div>
                    </div>

                    <div class="center-actions-label">Error correction code</div>
                    <select class="form-select action-select" id="errorCorrectionCodeSelect">
                        <option value="L">L (recommended)</option>
                        <option value="M">M</option>
                        <option value="Q">Q</option>
                        <option value="H">H</option>
                    </select>

                    <div class="center-actions-label">Border</div>
                    <select class="form-select action-select" id="border">
                        <option value="0">0</option>
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>

                    <div class="qr-size-wrapper">
                        <div class="center-actions-label">Size</div>
                        <div class="qr-slider-main-container">
                            <div class="qr-slider-container">
                                <input type="range" id="qrSizeSlider" min="150" max="1000" step="25" value="400">
                                <div id="qrSliderThumb">400</div>
                            </div>
                        </div>
                    </div>
                    <div class="center-actions-wrapper">
                        <div class="center-actions-label">Foreground</div>
                        <input type="color" id="foregroundColorInput" hidden>
                        <button class="color-button" id="foregroundColorButton">
                            <span class="color-code" id="foregroundColorCode">#000000</span>
                        </button>
                    </div>
                    <div class="center-actions-wrapper">
                        <div class="center-actions-label">Background</div>
                        <input type="color" id="backgroundColorInput" hidden>
                        <button class="color-button" id="backgroundColorButton">
                            <span class="color-code" id="backgroundColorCode">#FFFFFF</span>
                        </button>
                    </div>

                    <div class="row g-2 gap-2 mb-2 justify-content-center no-spacing">
                        <button class="col btn action-btn-ghost" onclick="downloadQR('png')"><i class="bi bi-filetype-png"></i> PNG</button>
                        <button class="col btn action-btn-ghost" onclick="downloadQR('jpeg')"><i class="bi bi-filetype-jpg"></i> JPEG</button>
                    </div>

                    <button class="btn action-btn-ghost" onclick="openFilePicker()"><i class="bi bi-qr-code-scan"></i> Scan QR Code</button>
                    <input type="file" id="fileInput" accept="image/png, image/jpeg" hidden onchange="handleFileSelect(event, fileFormat)">
                </div>

                <!-- Right Editor -->
                <div id="outputEditor" class="col-md-5 editor-panel image-background">
                    <div class="editor-header">
                        <span class="editor-title">Output</span>
                        <div class="editor-actions">
                            <button title="Download" onclick="downloadQR('jpeg')"><i class="bi bi-download icon-btn"></i></button>
                            <button title="Print" onclick="printQRCode()"><i class="bi bi-printer icon-btn"></i></button>
                            <div class="divider"></div>
                            <button class="btn-danger" title="Clear" data-undo-clear="Output cleared" onclick="clearQRCode()"><i class="bi bi-x-lg icon-btn"></i></button>
                            <button title="Fullscreen" onclick="toggleEditorFullScreen('outputEditor')"><i class="bi bi-arrows-fullscreen icon-btn"></i></button>
                        </div>
                    </div>
                    <div id="outputPrintContainer" style="display: none;"></div>
                    <div class="editor-body position-relative image-body">
                        <div id="outputContainerWrapper">
                            <div id="outputContainer" class="center-xy"></div>
                        </div>
                        <div class="qr-slider-wrapper" id="qrResizeSliderWrapper">
                            <input type="range" id="qrResizeSlider" class="form-range no-height" min="25" max="100" value="100" step="1">
                        </div>
                    </div>
                </div>

            </div>
        </div>


        <div id="footer-container"></div>

        <!-- Common JS -->
        <script src="js/tool-help.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/common.js"></script>
        <script src="js/custom-dropdown.js"></script>
        <script src="js/script.js"></script>
        <script src="js/find-replace.js"></script>

        <!-- CodeMirror 5.65.21 -->
        <script src="js/codemirror/codemirror.js"></script>
        <script src="js/codemirror/active-line.js"></script>

        <!-- Custom JS -->
        <script>
            
            // Elements
            const fileFormat = "QR";
            var currentInput = "";
            var originalDisplayQRSize = 0;
            const pageTitle = "QR Generator";
            const STORAGE_QR_TYPE_KEY = "qr_type";

            const slider = document.getElementById("qrSizeSlider");
            const qrResizeSlider = document.getElementById("qrResizeSlider");
            const qrResizeSliderWrapper = document.getElementById("qrResizeSliderWrapper");
            const thumb = document.getElementById("qrSliderThumb");
            const errorCorrectionCodeSelect = document.getElementById("errorCorrectionCodeSelect");
            const border = document.getElementById("border");
            CustomDropdown.enhance(errorCorrectionCodeSelect);
            CustomDropdown.enhance(border);
            const foregroundColorInput = document.getElementById("foregroundColorInput");
            const backgroundColorInput = document.getElementById("backgroundColorInput");
            const input = document.getElementById("input");
            const outputContainer = document.getElementById("outputContainer");
            const outputContainerWrapper = document.getElementById("outputContainerWrapper");
            const outputPrintContainer = document.getElementById("outputPrintContainer");
            const foregroundColorButton = document.getElementById('foregroundColorButton');
            const foregroundColorCode = document.getElementById('foregroundColorCode');
            const backgroundColorButton = document.getElementById('backgroundColorButton');
            const backgroundColorCode = document.getElementById('backgroundColorCode');

            const inputTotalLines = document.getElementById('inputTotalLines');
            const inputCurrentLine = document.getElementById('inputCurrentLine');
            const inputCurrentColumn = document.getElementById('inputCurrentColumn');

            const codeMirrorInput = createCodeMirrorEditor(input);

            // Runs after HTML content has fully loaded
            window.addEventListener("DOMContentLoaded", () => {
                // Initialize default color scheme for QR code as per current theme
                var foregroundColor = "#000000";
                var backgroundColor = "#FFFFFF";
                if (themeToggle.checked) {
                    foregroundColor = "#FFFFFF";
                    backgroundColor = "#000000";
                }

                foregroundColorInput.value = foregroundColor;
                foregroundColorButton.style.backgroundColor = foregroundColor;
                foregroundColorCode.textContent = foregroundColor.toUpperCase();
                foregroundColorCode.style.color = backgroundColor;

                backgroundColorInput.value = backgroundColor;
                backgroundColorButton.style.backgroundColor = backgroundColor;
                backgroundColorCode.textContent = backgroundColor.toUpperCase();
                backgroundColorCode.style.color = foregroundColor;
            });

            // Runs after HTML content has fully loaded, get qr type local storage
            window.addEventListener("DOMContentLoaded", () => {
                const qr_type = document.querySelectorAll("input[name='qr_type']");
                const saved_qr_type = getStorageString(STORAGE_QR_TYPE_KEY);

                let anyChecked = false;

                qr_type.forEach(type => {
                    if (type.value === saved_qr_type) {
                        type.checked = true;
                        anyChecked = true;
                    }
                });

                if (!anyChecked) {
                    qr_type[0].checked = true;
                    setStorageString(STORAGE_QR_TYPE_KEY, qr_type[0].value);
                }

                qr_type.forEach(radio => {
                    radio.addEventListener("change", () => {
                        setStorageString(STORAGE_QR_TYPE_KEY, radio.value);
                        generateQR();
                    });
                });
            });

            // Clears all input fields for QR code generation
            function clearQRInputs() {
                currentInput = "";
                clearInput(codeMirrorInput);
                clearQRCode();
            }

            // Clears generated QR code from display
            function clearQRCode() {
                outputContainer.innerHTML = "";
                outputPrintContainer.innerHTML = "";
                qrResizeSliderWrapper.style.display = "none";
            }

            // Reports whether a QR code is showing so Undo can redraw it after Clear.
            function getPageUndoState() {
                return { hasQRCode: outputContainer.childElementCount > 0 };
            }

            // Redraws the QR code when Undo restores input that had one showing before Clear.
            function restorePageUndoState(state) {
                if (state.hasQRCode && outputContainer.childElementCount === 0 && codeMirrorInput.getValue().trim()) generateQR();
            }

            // Generates a QR code image in specified container with given size
            function generateQRImage(container, size) {
                var selectedCorrectLevel = errorCorrectionCodeSelect.value;
                    selectedCorrectLevel = selectedCorrectLevel === "M"
                        ? QRCode.CorrectLevel.M
                        : selectedCorrectLevel === "Q"
                            ? QRCode.CorrectLevel.Q
                            : selectedCorrectLevel === "H"
                                ? QRCode.CorrectLevel.H
                                : QRCode.CorrectLevel.L

                container.innerHTML = "";

                new QRCode(container, {
                    text: currentInput,
                    width: size,
                    height: size,
                    colorDark: foregroundColorInput.value,
                    colorLight: backgroundColorInput.value,
                    correctLevel: selectedCorrectLevel
                });
            }

            // Updates input field behavior based on selected type
            function updateInputAsPerType() {
                try {
                    currentInput = codeMirrorInput.getValue();
                    const selected = document.querySelector('input[name="qr_type"]:checked');
                    if (selected && selected.value === "encoded") {
                        var minifiedString = "";

                        try { minifiedString = JSON.stringify(JSON.parse(currentInput)); }
                        catch {
                            try { minifiedString = new XMLSerializer().serializeToString(parseXML(currentInput)).replace(/>\s+</g, "><").trim(); }
                            catch { minifiedString = currentInput; }
                        }

                        currentInput = btoa(unescape(encodeURIComponent(minifiedString)));
                    }
                } catch (error) {
                    currentInput = codeMirrorInput.getValue();
                    console.log("Update input as per type error:", error.message);
                    showErrorToast("Error updating input as per type");
                }
            }

            // Generates QR code with optional resizing for display and print
            function generateQR(resizeDisplayQRCode = true, resizePrintQRCode = true) {
                try {
                    updateInputAsPerType();
                    const element = currentInput;
                    if (!element.trim()) {
                        clearQRCode();
                        showInfoToast("Please enter content to generate QR code");
                        return;
                    }

                    const borderValue = parseInt(border.value, 10) || 1;
                    const sizeWithoutBorder = Math.abs((parseInt(slider.value) || 400) - (borderValue * 2));

                    if (resizeDisplayQRCode) {
                        const availableWidth = Math.abs(outputContainer.offsetWidth - 30);
                        const availableHeight = Math.abs(outputContainer.offsetHeight - 30);
                        const newSize = Math.min(availableWidth, availableHeight) - 100;
                        originalDisplayQRSize = newSize;
                        generateQRImage(outputContainer, newSize);
                    }

                    if (resizePrintQRCode) generateQRImage(outputPrintContainer, sizeWithoutBorder);

                    qrResizeSliderWrapper.style.display = "block";
                    resizeOutputContainer();
                } catch (error) {
                    console.log("Generating QR code error:", error.message);
                    showErrorToast("Error generating QR code");
                }
            }

            // Updates qrcode size when slider value changes
            qrResizeSlider.addEventListener("input", () => resizeOutputContainer());

            // Resizes qrcode in output container
            function resizeOutputContainer() {
                const resizeSliderValue = parseInt(qrResizeSlider.value) || 100;
                generateQRImage(outputContainer, (originalDisplayQRSize * resizeSliderValue / 100));
            }

            // Downloads generated QR code in specified jpeg/png format
            function downloadQR(format) {
                const canvas = document.querySelector("#outputPrintContainer canvas");
                if (!canvas) {
                    showInfoToast("No QRCode to download");
                    return;
                }

                const borderValue = parseInt(border.value, 10) || 1;
                const borderedCanvas = document.createElement("canvas");
                const context = borderedCanvas.getContext("2d");
                borderedCanvas.width = canvas.width + borderValue * 2;
                borderedCanvas.height = canvas.height + borderValue * 2;
                if (borderValue > 0) {
                    context.fillStyle = backgroundColorInput.value;
                    context.fillRect(0, 0, borderedCanvas.width, borderedCanvas.height);
                }
                context.drawImage(canvas, borderValue, borderValue);

                let mime = format === "jpeg" ? "image/jpeg" : "image/png";
                let link = document.createElement("a");

                link.href = borderedCanvas.toDataURL(mime);
                link.download = `qrcode.${format}`;

                link.click();
            }

            // Sends generated QR code to printer
            function printQRCode() {
                try {
                    const data = outputContainer.innerHTML;
                    if (!data) {
                        showInfoToast("Nothing to print");
                        return;
                    }
                    const printWindow = window.open("", "_blank");
                    printWindow.document.write(`
                        <html>
                            <head>
                                <title>Codexael Toolstack — ${pageTitle}</title>
                                <style>
                                    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; max-width: 100%; max-height: 100%; }
                                    body { font-family: monospace; padding: 20px; background-color: ${backgroundColorInput.value} !important; }
                                    .center-xy { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
                                </style>
                            </head>
                            <body>
                                <div class="center-xy">${data}</div>
                            </body>
                        </html>
                    `);
                    printWindow.document.close();
                    printWindow.onload = function () {
                        printWindow.focus();
                        printWindow.print();
                        printWindow.close();
                    };
                } catch (error) {
                    console.log("Printing QR code error:", error.message);
                    showErrorToast("Error printing QR code");
                }
            }
            
            // Updates slider thumb position based on QR code size
            function updateSliderThumb(resizeDisplayQRCode = true, resizePrintQRCode = true) {
                const min = Number(slider.min);
                const max = Number(slider.max);
                const val = Number(slider.value);

                thumb.style.left = `${((val - min) / (max - min)) * slider.offsetWidth}px`;
                thumb.textContent = val;
                qrResizeSlider.value = 100;
                if (resizeDisplayQRCode) generateQR(true, resizePrintQRCode);
            }

            updateSliderThumb(false);

            slider.addEventListener("input", updateSliderThumb);
            window.addEventListener("resize", screenResized);

            // Handles slider thumb position when the screen or window is resized
            function screenResized() {
                if (currentInput.trim()) updateSliderThumb(true, false);
                else updateSliderThumb(false);
            }

            // Open color picker when button clicked
            foregroundColorButton.addEventListener('click', () => { foregroundColorInput.click(); });
            backgroundColorButton.addEventListener('click', () => { backgroundColorInput.click(); });

            // Update button background and hex code when color picked for qrcode foreground
            foregroundColorInput.addEventListener('input', (e) => {
                const color = e.target.value;
                foregroundColorButton.style.backgroundColor = color;
                foregroundColorCode.textContent = color.toUpperCase();
                generateQR();
            });

            // Update button background and hex code when color picked for qrcode background
            backgroundColorInput.addEventListener('input', (e) => {
                const color = e.target.value;
                backgroundColorButton.style.backgroundColor = color;
                backgroundColorCode.textContent = color.toUpperCase();
                generateQR();
            });

            // Handles generating qrcode when user types in the input field
            codeMirrorInput.on("change", function () {
                currentInput = codeMirrorInput.getValue();
                generateQR();
            });

            // Scans QR code from uploaded image file
            function scanQRCodeImage(fileData) {
                try {
                    const qrImage = new Image();
                    qrImage.src = fileData;
                    qrImage.onload = function () {
                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");

                        canvas.width = qrImage.width;
                        canvas.height = qrImage.height;
                        context.drawImage(qrImage, 0, 0);

                        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                        const qrCode = jsQR(imageData.data, imageData.width, imageData.height);

                        if (qrCode) { if (decodeImageAsPerType(qrCode.data)) generateQR(); }
                        else showErrorToast("No valid QR code found in image");
                    };
                } catch (error) {
                    console.log("QR scanning error:", error.message);
                    showErrorToast("Error scanning qrcode");
                }
            }

            // Decodes QR image content based on selected type
            function decodeImageAsPerType(qrData) {
                try {
                    clearQRInputs();

                    const selected = document.querySelector('input[name="qr_type"]:checked');
                    if (selected && selected.value === "encoded") {
                        var beautifiedString = "";

                        qrData = decodeURIComponent(escape(atob(qrData)));
                        try { beautifiedString = JSON.stringify(JSON.parse(qrData), null, 2); }
                        catch {
                            try { beautifiedString = formatXML(new XMLSerializer().serializeToString(parseXML(qrData)), 2); }
                            catch { beautifiedString = qrData; }
                        }

                        codeMirrorInput.setValue(beautifiedString);
                    }
                    else codeMirrorInput.setValue(qrData);
                    return true;
                } catch (error) {
                    console.log("Decode and beautify image data as per type error:", error.message);
                    showErrorToast("Error decoding and beautifying image data as per type");
                    return false;
                }
            }

            setupEditors([
                createEditorConfig(codeMirrorInput, inputTotalLines, inputCurrentLine, inputCurrentColumn)
            ]);

        </script>
        
    </body>
</html>
